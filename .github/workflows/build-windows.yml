name: Build Windows 11 Release

on:
  workflow_dispatch:
  push:
    paths:
      - "app.py"
      - "engine.py"
      - "requirements.txt"
      - "AudioDNAStudioPro.spec"
      - "installer/**"
      - "assets/**"
      - ".github/workflows/build-windows.yml"

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile app.py engine.py

      - name: Verify BS-RoFormer released API
        shell: pwsh
        run: |
          python -c "import bs_roformer; from bs_roformer.inference import proc_folder; from bs_roformer import DEFAULT_MODEL, ensure_model_assets; print('BS-RoFormer import OK:', DEFAULT_MODEL)"

      - name: Verify Demucs API
        shell: pwsh
        run: |
          python -c "import demucs; from demucs.separate import main; print('Demucs import OK')"

      - name: Verify download dependencies
        shell: pwsh
        run: |
          python -c "import requests, certifi; print('Requests/certifi OK:', certifi.where())"

      - name: Verify embedded stdio guard
        shell: pwsh
        run: |
          python -c "from pathlib import Path; s=Path('app.py').read_text(encoding='utf-8'); assert '_ensure_stdio()' in s and 'sys.stdout' in s or '_stdio_sys' in s; print('Embedded stdio guard OK')"

      - name: Build Windows executable
        run: python -m PyInstaller --noconfirm --clean AudioDNAStudioPro.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (!(Test-Path "dist\AudioDNAStudioPro\AudioDNAStudioPro.exe")) { throw "EXE missing" }

      - name: Packaged dependency self-check
        shell: pwsh
        run: |
          & "dist\AudioDNAStudioPro\AudioDNAStudioPro.exe" --self-check
          if ($LASTEXITCODE -ne 0) { throw "Packaged EXE dependency self-check failed with exit code $LASTEXITCODE" }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "installer\AudioDNAStudioPro.iss"

      - uses: actions/upload-artifact@v4
        with:
          name: AudioDNAStudioPro-Windows11
          path: |
            dist/AudioDNAStudioPro/**
            release/*.exe
          retention-days: 14
